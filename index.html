<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#120817">
<title>رسالة صغيرة إلى نفين 🤍</title>
<meta property="og:title" content="رسالة صغيرة إلى نفين 🤍">
<meta property="og:description" content="يمكن في حدا حاب يوصلِك كلمة حلوة..."><meta name="description" content="رسالة لطيفة وخاصة إلى نفين">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#e8ca91;--rose:#e69aae;--cream:#fff4e9;--muted:#e9d9d2}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:"Cairo",sans-serif;color:var(--cream);min-height:100vh;min-height:100dvh;overflow-x:hidden;background:radial-gradient(90% 65% at 50% 110%,#71334f 0,transparent 65%),radial-gradient(70% 60% at 0% 20%,#322044 0,transparent 70%),linear-gradient(155deg,#100817,#251229 58%,#35162d)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.stage{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:grid;place-items:center;text-align:center;padding:max(88px,8vh) 6vw max(48px,7vh)}
.scene{display:none;width:100%;max-width:620px;animation:appear .85s ease both}.scene.on{display:block}
@keyframes appear{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes glow{50%{box-shadow:0 12px 45px -8px #e69aae88}}
.moon{width:58px;height:58px;margin:0 auto 1.1rem;border-radius:50%;box-shadow:inset -15px -7px 0 0 var(--gold);transform:rotate(-25deg);filter:drop-shadow(0 0 17px #e8ca9177)}
h1,h2,.script{font-family:"Aref Ruqaa",serif}
h1{font-size:clamp(2.65rem,12vw,4.4rem);line-height:1.5;padding:.08em 0;background:linear-gradient(135deg,#fff0cf,var(--gold) 48%,var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(2.1rem,8.5vw,3.25rem);line-height:1.5;padding:.1em 0;background:linear-gradient(135deg,#fff0cf,var(--gold) 48%,var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font-size:.78rem;letter-spacing:.18em;color:var(--gold);opacity:.9;margin-bottom:.7rem}
.sub{font-size:clamp(1rem,4vw,1.16rem);line-height:2;margin:.45rem 0 1.6rem;color:var(--muted)}
.card{position:relative;padding:clamp(1.65rem,6vw,2.65rem) clamp(1.15rem,5vw,2rem);margin:0 auto 1.45rem;border:1px solid #e8ca914d;border-radius:28px;background:linear-gradient(145deg,#ffffff0d,#ffffff05);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 28px 85px -35px #000a;overflow:hidden}
.card:before{content:"✦";position:absolute;top:13px;right:18px;color:#e8ca9177;font-size:1rem}.card:after{content:"✦";position:absolute;bottom:13px;left:18px;color:#e8ca9177;font-size:1rem}
.msg{font-family:"Aref Ruqaa",serif;font-size:clamp(1.55rem,6vw,2.12rem);line-height:2.05;white-space:normal}
.w{display:inline-block;opacity:0;animation:appear .65s ease forwards}
.dots{display:flex;gap:8px;justify-content:center;margin:0 0 1.35rem}.dots i{width:6px;height:6px;border-radius:10px;background:#fff3e855;transition:.35s}.dots i.on{width:22px;background:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;margin:.35rem;padding:.78rem 1.55rem;min-height:48px;border-radius:999px;border:1px solid #e8ca91a8;background:#ffffff08;color:var(--cream);font:600 1rem "Cairo",sans-serif;cursor:pointer;text-decoration:none;transition:transform .2s,background .2s,border-color .2s}
.btn:hover{background:#e8ca911b;transform:translateY(-2px)}.btn:focus-visible,.in:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
.btn.main{border:0;color:#2b1524;background:linear-gradient(120deg,#f0d9a8,var(--rose));box-shadow:0 10px 30px -12px #e69aae}.btn.main:hover{filter:brightness(1.06)}.pulse{animation:glow 2.7s ease-in-out infinite}
.soft{border-color:transparent;color:#e9d9d2;opacity:.82;font-size:.92rem}.in{width:100%;max-width:350px;padding:.8rem 1.2rem;margin:.25rem 0 .7rem;border-radius:999px;border:1px solid #e8ca9188;background:#ffffff0b;color:var(--cream);font:500 1.05rem "Cairo",sans-serif;text-align:center}.in::placeholder{color:#e9d9d299}
.res{min-height:1.8rem;margin:.45rem 0;font-size:.98rem;color:var(--gold)}
.hint{margin:.55rem auto;max-width:490px;padding:1rem 1.05rem;border-radius:17px;border:1px solid #e8ca9155;background:#ffffff0a;color:#fff0dc;font-size:1rem;line-height:1.9;animation:appear .65s both}
.music{position:fixed;z-index:5;top:max(14px,env(safe-area-inset-top));left:14px;display:flex;align-items:center;gap:7px;border:1px solid #e8ca914d;border-radius:999px;padding:.52rem .85rem;background:#160c1dcc;color:#f8e9d9;font:500 .82rem "Cairo",sans-serif;backdrop-filter:blur(12px);cursor:pointer}
.music .dot{width:7px;height:7px;background:#b5a5a5;border-radius:50%}.music.playing .dot{background:#a8d6ad;box-shadow:0 0 9px #a8d6ad}
.footnote{font-size:.8rem;color:#e9d9d28a;margin-top:1.25rem;line-height:1.8}
@media(max-width:420px){.stage{padding-left:5vw;padding-right:5vw}.btn{padding:.72rem 1.15rem;font-size:.95rem}.card{border-radius:23px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}.w{opacity:1}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<button class="music" id="musicBtn" type="button" aria-pressed="false"><span class="dot"></span><span id="musicLabel">شغّلي الموسيقى ♫</span></button>
<main class="stage">
  <section class="scene on" id="gate">
    <div class="moon"></div>
    <p class="eyebrow">A LITTLE NOTE FOR YOU</p>
    <h1 id="gTo">إلى نفين</h1>
    <p class="sub" id="gSub"></p>
    <button class="btn main pulse" id="gBtn">افتحي الرسالة 🤍</button>
    <p class="footnote">خذي وقتك... واقرئيها على راحتك</p>
  </section>

  <section class="scene" id="story">
    <p class="eyebrow">كلمات بسيطة من القلب</p>
    <div class="card"><p class="msg" id="msg" aria-live="polite"></p></div>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <button class="btn main" id="nxt">التالي</button>
  </section>

  <section class="scene" id="guess">
    <div class="moon"></div>
    <p class="eyebrow">A SMALL GUESSING GAME</p>
    <h2>مين برأيك؟</h2>
    <p class="sub">يمكن بتعرفيه من الجامعة... خذي تخمينك 😊</p>
    <input class="in" id="gin" placeholder="اكتبي الاسم هون" autocomplete="off" aria-label="اكتبي الاسم">
    <div>
      <button class="btn main" id="go">هاي إجابتي</button>
      <button class="btn" id="hBtn">بدي التلميح الوحيد</button>
    </div>
    <p class="res" id="res" aria-live="polite"></p>
    <div id="hints"></div>
    <div>
      <button class="btn soft" id="rev" style="display:none">خلّص، بدي أعرف مين</button>
      <button class="btn soft" id="no">مش حابة أكمّل</button>
    </div>
  </section>

  <section class="scene" id="win">
    <div class="moon"></div>
    <p class="eyebrow">A NAME BEHIND THE NOTE</p>
    <h2 id="wT"></h2>
    <div class="card"><p class="msg" id="wX"></p></div>
    <div id="links"></div>
    <p class="footnote">الرسالة وصلت، والباقي حسب راحتك 🤍</p>
  </section>

  <section class="scene" id="noS">
    <div class="moon"></div>
    <div class="card"><p class="msg" id="nX"></p></div>
  </section>
</main>

<script>
// الإعدادات الأساسية
const CFG={
  to:"نفين",
  from:"أحمد",
  answers:["أحمد","احمد"],
  instagram:"", // بنضيف اسم الحساب لاحقاً
  hint:"في شخص، كل ما بشوفك، بتلاقي عيونه بتدور على عيونك... ولما تلتقي النظرات، بتصير اللحظة أحلى من إنها تمرّ عادي.",
  gateText:"في شخص من الجامعة حاب يوصلِك كم كلمة حلوة... رسالة بسيطة، ومن دون أي إحراج أو ضغط عليكِ 🤍",
  messages:[
    "نفين... يمكن ما حكينا كثير، بس في شخص صار ينتبه لوجودك بالجامعة، وكل مرة بتتقاطع فيها العيون بتضل اللحظة بباله.",
    "في ناس حضورها هادي، بس بترك أثر حلو... وإنتِ من الناس اللي ابتسامتك ممكن تخلّي اليوم ألطف، حتى من غير ما تنتبهي.",
    "يمكن ما عرفت كيف أبدأ حكي معك، ويمكن الخجل كان دايماً يسبقني... عشان هيك اخترت أوصل هالكلمات بطريقة بسيطة. بصراحة، حاب أتعرف عليكِ أكثر، إذا إنتِ كمان حابة.",
    "وبدي أدعيلك من قلبي: الله يرحم والدك ويغفرله ويسكنه فسيح جناته. بعرف إنه ما في كلام بيمحي وجع الفقد، بس بتمنى تضل ذكراه الحلوة مصدر دفء بقلبك، وتكون أيامك الجاية مليانة طمأنينة وفرح. الله يقوّي قلبك ويجبر خاطرك.",
    "إنتِ بتستاهلي كل كلمة حلوة، وكل لحظة راحة، وكل خير بالدنيا. ويمكن هالرسالة تكون بداية معرفة لطيفة، ويمكن تضل مجرد ابتسامة حلوة بيومك... وبالحالتين بتمنالك السعادة من قلبي.",
    "ما في أي ضغط إنك تردّي أو تكمّلي. إذا حبيتي، خمني مين صاحب الرسالة... وإذا ما حبيتي، عادي تماماً، وبضل الاحترام والتقدير إلك مثل ما هم. 🤍"
  ],
  winTitle:"أنا أحمد 🤍",
  winText:"يمكن كان صعب عليّ أبدأ الحكي وجهاً لوجه، بس حبيت أكون صريح معك بطريقة لطيفة. أنا فعلاً حاب أتعرف عليكِ أكثر، ونحكي إذا إنتِ مرتاحة للفكرة. ما في أي استعجال ولا أي ضغط... القرار إلك وبحترمه بكل الأحوال.",
  noText:"ولا يهمك نفين، وبحترم رغبتك تماماً. بتمنالك من قلبي أيام حلوة وراحة بال وتوفيق بكل خطوة. 🤍"
};
</script>
<script>
(()=>{
const C=CFG,$=s=>document.querySelector(s);
const show=id=>document.querySelectorAll(".scene").forEach(e=>e.classList.toggle("on",e.id===id));
const norm=s=>s.normalize("NFKD").replace(/[\u064B-\u065F\u0670\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/\s+/g," ").trim().toLowerCase();

$("#gTo").textContent="إلى "+C.to;
$("#gSub").textContent=C.gateText;
$("#nX").textContent=C.noText;

// عرض الرسالة صفحةً صفحة
let i=0;const dots=$("#dots");
C.messages.forEach(()=>dots.appendChild(document.createElement("i")));
function step(){
  const m=$("#msg");m.textContent="";
  C.messages[i].split(" ").forEach((word,k)=>{
    const span=document.createElement("span");span.className="w";span.textContent=word;
    span.style.animationDelay=(k*.105)+"s";m.append(span," ");
  });
  [...dots.children].forEach((d,k)=>d.classList.toggle("on",k===i));
  $("#nxt").textContent=i<C.messages.length-1?"التالي":"كمّلي 🤍";
}
$("#gBtn").onclick=()=>{startMusic();show("story");step()};
$("#nxt").onclick=()=>{if(i<C.messages.length-1){i++;step()}else show("guess")};

// تخمين الاسم مع تلميح واحد فقط
const answers=C.answers.map(norm);let tries=0,hintShown=false;
const wrong=["مش هو 😊 جرّبي كمان مرة.","قريب يمكن... بس مش هو 😉","لسه ما وصلتي للاسم الصحيح 🤍"];
function reveal(){
  $("#wT").textContent=C.winTitle;
  $("#wX").textContent=C.winText;
  show("win");burst();
}
$("#go").onclick=()=>{
  const guess=norm($("#gin").value);if(!guess)return;
  if(answers.includes(guess)){reveal();return;}
  $("#res").textContent=wrong[tries%wrong.length];tries++;
  if(tries>=3)$("#rev").style.display="inline-flex";
};
$("#gin").onkeydown=e=>{if(e.key==="Enter")$("#go").click()};
$("#hBtn").onclick=()=>{
  if(hintShown)return;
  const item=document.createElement("div");item.className="hint";item.textContent="✦ "+C.hint;
  $("#hints").append(item);hintShown=true;$("#hBtn").style.display="none";
};
$("#rev").onclick=reveal;
$("#no").onclick=()=>show("noS");

// إنستغرام فقط؛ نضيف الحساب عندما يصبح جاهزاً
if(C.instagram.trim()){
  const link=document.createElement("a");link.className="btn main";
  link.href="https://instagram.com/"+C.instagram.replace(/^@/,"").trim();
  link.target="_blank";link.rel="noopener noreferrer";link.textContent="احكي معي على إنستغرام ✉";
  $("#links").append(link);
}

// لحن رومانسي أصلي وهادئ باستخدام Web Audio، يبدأ بعد تفاعل المستخدم
let audioCtx=null,master=null,musicTimer=null,musicOn=false,noteIndex=0;
const melody=[261.63,329.63,392.00,329.63,293.66,349.23,440.00,392.00,261.63,329.63,392.00,493.88,440.00,392.00,349.23,329.63];
function playTone(freq,when,duration,volume,type="sine"){
  const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
  osc.type=type;osc.frequency.setValueAtTime(freq,when);
  gain.gain.setValueAtTime(.0001,when);gain.gain.exponentialRampToValueAtTime(volume,when+.12);
  gain.gain.exponentialRampToValueAtTime(.0001,when+duration);
  osc.connect(gain);gain.connect(master);osc.start(when);osc.stop(when+duration+.04);
}
function musicBeat(){
  if(!audioCtx||!musicOn)return;
  const now=audioCtx.currentTime,base=melody[noteIndex%melody.length];
  playTone(base,now,1.75,.035,"sine");
  playTone(base*2,now+.035,1.25,.009,"sine");
  if(noteIndex%4===0)playTone(base/2,now,2.1,.018,"triangle");
  noteIndex++;musicTimer=setTimeout(musicBeat,820);
}
async function startMusic(){
  try{
    if(!audioCtx){const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass)return;
      audioCtx=new AudioContextClass();master=audioCtx.createGain();master.gain.value=.48;master.connect(audioCtx.destination);}
    await audioCtx.resume();musicOn=true;$("#musicBtn").classList.add("playing");$("#musicBtn").setAttribute("aria-pressed","true");$("#musicLabel").textContent="إيقاف الموسيقى ♫";
    clearTimeout(musicTimer);musicBeat();
  }catch(err){$("#musicLabel").textContent="الموسيقى غير متاحة";}
}
function stopMusic(){musicOn=false;clearTimeout(musicTimer);if(master)master.gain.setTargetAtTime(.0001,audioCtx.currentTime,.12);$("#musicBtn").classList.remove("playing");$("#musicBtn").setAttribute("aria-pressed","false");$("#musicLabel").textContent="تشغيل الموسيقى ♫";}
$("#musicBtn").onclick=()=>{if(musicOn)stopMusic();else{if(master)master.gain.setTargetAtTime(.48,audioCtx.currentTime,.12);startMusic()}};

// نجوم وقلوب خفيفة بالخلفية
const canvas=$("#fx"),ctx=canvas.getContext("2d"),reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
let W=0,H=0,stars=[],particles=[];
function resize(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);stars=Array.from({length:Math.round(W*H/10500)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.25+.25,p:Math.random()*6,s:.5+Math.random()}));}
addEventListener("resize",resize);resize();
function draw(t){ctx.clearRect(0,0,W,H);ctx.fillStyle="#fff1df";stars.forEach(s=>{ctx.globalAlpha=.25+.65*Math.abs(Math.sin(t/1100*s.s+s.p));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()});
  if(!reduced&&Math.random()<.018)particles.push({x:Math.random()*W,y:H+15,vx:(Math.random()-.5)*.35,vy:-.65-Math.random()*.65,life:2.6,size:9+Math.random()*11});
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=.006;ctx.globalAlpha=Math.max(0,p.life)*.2;ctx.fillStyle="#e69aae";ctx.font=p.size+"px serif";ctx.fillText("♥",p.x,p.y)});particles=particles.filter(p=>p.life>0);ctx.globalAlpha=1;if(!reduced)requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
function burst(){if(reduced)return;for(let k=0;k<58;k++){const a=Math.random()*Math.PI*2,v=1.5+Math.random()*4;particles.push({x:W/2,y:H/2,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.3,life:1.3,size:11+Math.random()*12});}}
})();
</script>
</body>
</html>

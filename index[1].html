<style>
:root{--gold:#e8ca91;--rose:#e69aae;--cream:#fff4e9;--muted:#e9d9d2}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:"Cairo",sans-serif;color:var(--cream);min-height:100vh;min-height:100dvh;overflow-x:hidden;background:radial-gradient(90% 65% at 50% 110%,#71334f 0,transparent 65%),radial-gradient(70% 60% at 0% 20%,#322044 0,transparent 70%),linear-gradient(155deg,#100817,#251229 58%,#35162d)}

.dots{display:flex;gap:8px;justify-content:center;margin:0 0 1.35rem}.dots i{width:6px;height:6px;border-radius:10px;background:#fff3e855;transition:.35s}.dots i.on{width:22px;background:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;margin:.35rem;padding:.78rem 1.55rem;min-height:48px;border-radius:999px;border:1px solid #e8ca91a8;background:#ffffff08;color:var(--cream);font:600 1rem "Cairo",sans-serif;cursor:pointer;text-decoration:none;transition:transform .2s,background .2s,border-color .2s}
.btn:hover{background:#e8ca911b;transform:translateY(-2px)}.btn:focus-visible,.in:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
.btn.main{border:0;color:#2b1524;background:linear-gradient(120deg,#f0d9a8,var(--rose));box-shadow:0 10px 30px -12px #e69aae}.btn.main:hover{filter:brightness(1.06)}.pulse{animation:glow 2.7s ease-in-out infinite}
.soft{border-color:transparent;color:#e9d9d2;opacity:.82;font-size:.92rem}.in{width:100%;max-width:350px;padding:.8rem 1.2rem;margin:.25rem 0 .7rem;border-radius:999px;border:1px solid #e8ca9188;background:#ffffff0b;color:var(--cream);font:500 1.05rem "Cairo",sans-serif;text-align:center}.in::placeholder{color:#e9d9d299}
.res{min-height:1.8rem;margin:.45rem 0;font-size:.98rem;color:var(--gold)}

<script>
// الإعدادات الأساسية
const CFG={
  to:"نفين",
  secretAnswer:"احمد",
  instagram:"", // بنضيف اسم الحساب لاحقاً
  hint:"كل ما بتتقاطع عيونكم، بتلاحظي إنه في شخص بنظر لعينيك... وكأنه كان مستني هاللحظة من غير ما يحكي.",
gateText:"يمكن ما بتعرفي مين صاحب هالرسالة، ويمكن تستغربي من وصولها إلك... بس الفكرة بسيطة: في كلمة حلوة كان خاطر صاحبها توصلك، من غير ما يطلب منك أي شيء بالمقابل. خذي راحتك واقرئيها على مهلك. 🤍",
  messages:[
    "نفين... قبل أي شيء، بدي أحكيلك إنك مش مطالبة تعرفي مين كاتب هالكلام، ولا إنك تكمّلي القراءة إذا ما حسيتي إنها مناسبة إلك. اعتبريها رسالة وصلت من شخص حاب يحكيلك كلمة لطيفة، وبس.",
    "في أحياناً أشخاص بيلفتوا انتباهنا من غير ما يعملوا إشي مقصود. مجرد حضورهم، أو نظرة عابرة، أو لحظة قصيرة بتضل بالبال أكثر من المتوقع. ويمكن ما ينتبهوا أصلاً إن في حدا صار يبتسم لما يشوفهم.",
    "وهذا تقريباً اللي صار معي. صار في إعجاب هادي من بعيد، إعجاب خلاني أتمنى أعرفك أكثر من مجرد نظرات ومواقف عابرة. مش رح أدّعي إني بعرف شخصيتك أو تفاصيل حياتك؛ الحقيقة إني لسه ما بعرفك بالشكل الكافي، وعشان هيك بالذات حاب تكون في فرصة لتعارف حقيقي إذا إنتِ حبيتي.",
    "يمكن الكلام سهل، بس بدي تكوني عارفة إن قصدي مش مجاملة عابرة ولا كلام كبير حتى أترك انطباع. اللي شدّني إني حسّيت عندي رغبة أتعرف على الإنسان اللي وراء هالحضور: شو بحب؟ شو بطموح؟ شو الأشياء الصغيرة اللي بتفرحه؟ وشو المواضيع اللي ممكن يحكي فيها لساعات من غير ما يمل؟",
    "وبعيداً عني وعن موضوع الإعجاب، في شغلة بتمنى تضل ببالك: لا تقللي من نفسك أبداً. لا تخلي يوم صعب يقنعك إنك أقل من اللي بتتمنيه، ولا تخلي مقارنة مع غيرك تنسيكي إن إلك طريقك ووقتك. مش لازم تكوني بأحسن حالاتك كل يوم، ومش لازم تنجزي كل شيء بسرعة حتى تكوني فخورة بحالك.",
    "إنتِ بتستاهلي تحكي مع حالك بلطف، وتسامحيها لما تغلط، وتفرحي بخطواتك الصغيرة قبل الكبيرة. بتستاهلي ناس يسمعوا رأيك باهتمام، ويحترموا حدودك، ويكون وجودهم بحياتك راحة مش ضغط. وما في أي إنجاز أو إعجاب أو رأي من شخص ثاني هو اللي بيحدد قيمتك؛ قيمتك موجودة فيك، حتى بالأيام اللي بتنسي فيها هالشي.",
    "بتمنى تكون أيامك الجاية أهدى وأخف، وتلاقي فيها أسباب كثيرة تضحكي من قلبك. بتمنى توصلي للأشياء اللي بتحلمي فيها، وتفاجئي حالك بقديش إنتِ قادرة، وتكون حواليك صحبة صادقة بتفرح لفرحك وبتوقف جنبك وقت التعب. وإذا تأخرت أمنية أو تعقّد طريق، لا تعتبري هاد نهاية الحكاية؛ أحياناً الأشياء الحلوة بدها وقت، وإنتِ مش متأخرة عن حياتك.",
    "أما أنا، فما بدي أزيّن الحقيقة: ممكن يكون الإعجاب من طرف واحد، وممكن تكون الرسالة مفاجأة إلك، وممكن ما يكون عندك أي اهتمام تعرفي مين صاحبها. كل هالاحتمالات طبيعية، وما فيها أي غلط. المشاعر ما بتنفرض، وما في رسالة مهما كانت حلوة بتقدر أو لازم تغيّر شعور إنسان.",
    "اللي بتمناه فقط إنك تفهمي إن في شخص شاف فيك شيئاً لفت قلبه، وحب يعبّر عنه بطريقة محترمة بدل ما يضل ساكت. وإذا كان عندك فضول أو رغبة بسيطة بالتعارف، ممكن تكون هاي بداية حديث عادي وبسيط، من غير توقعات كبيرة ومن غير استعجال. وإذا ما عندك هالرغبة، فبكل صدق بتمنالك الخير، وبحترم قرارك مثل ما هو.",
    "وإذا بتسمحيلي أترك عندك فكرة أخيرة: لا تستني من حدا يذكّرك إنك مميزة حتى تصدقي هالشي. لا تربطي ابتسامتك بمديح، ولا ثقتك باهتمام شخص، ولا أحلامك بتوقيت غيرك. اختاري نفسك، واهتمي براحتك، وخلي قلبك قريب من الأشياء اللي بتشبهك وبتفرحك. إنتِ بتستاهلي حياة فيها احترام وطمأنينة وفرص حلوة، وبتستاهلي تكوني محاطة بناس بيقدّروا وجودك من غير ما تضطري تطلبي منهم هالشي.",
    "يمكن ما أكون عرفت أوصف كل اللي خطر ببالي، ويمكن بعض الكلام ما بيوصل مثل ما بنحسّه، بس كتبتلك لأنّي حبيت توصلك رسالة فيها تقدير صادق، مش طلب ولا ضغط. ما بدي منك وعد، ولا جواب مجاملة، ولا أي شعور مش موجود عندك. بدي بس تكوني مرتاحة وإنتِ بتقرئيها، وتعرفي إن الإعجاب ممكن يكون لطيف ومحترم حتى لو ما صار منه شيء.",
    "فإذا ابتسمتي ولو شوي، بكون هاد أجمل شيء ممكن تطلع فيه الرسالة. وإذا حبيتي تعرفي صاحبها، بتكون فرصة نبدأ من أول وجديد بكلام بسيط وواضح، ونتعرف على بعض مثل أي شخصين، خطوة بخطوة. أما إذا فضّلتي تتركيها ذكرى مجهولة، فهالشي كمان مفهوم ومحترم.",
    "الله يكتبلك أياماً تشبه قلبك، مليانة راحة ونجاح وأخبار بتفرحك. وتذكّري دائماً: إنتِ مش بحاجة تثبتي لأي حدا إنك تستحقي الاهتمام؛ إنتِ بتستحقي الاحترام واللطف من البداية. 🤍"
  ],

  maybeMessage:`نفين...

يمكن كلمة «يمكن» هي أصدق عنوان لهالصفحة؛ لأنّي فعلاً مش عارف شو ممكن يكون شعورك وإنتِ بتقرئي هالكلام. يمكن تستغربي، يمكن تبتسمي، ويمكن تكمّلي القراءة وتعتبريها مجرد رسالة لطيفة وصلت بيوم عادي. وكل هالاحتمالات عادية، وما في احتمال منها لازم يزعجك.

بدي أحكيلك من البداية: أنا معجب فيك. مش رح أقول إني بحبك أو إني بعرفك من زمان، لأن هاد أكبر من الحقيقة، وما بدي أبدأ معك بكلام مش دقيق. اللي صار إنه في شخص لفت انتباهي، وصرت أنتبه للحظات الصغيرة اللي ممكن غيري ما يعطيها أهمية. نظرة بتتقاطع مع نظرة، وجودك بمكان، ومرور سريع بترك أثر لطيف. يمكن إنتِ ما انتبهتي لهالتفاصيل، ويمكن بالنسبة إلك كانت لحظات عادية جداً، بس بالنسبة إلي كانت كافية تخليني أتمنى يكون في فرصة أحكي معك وأعرفك أكثر.

والغريب إن الإعجاب أحياناً ببلّش قبل ما نعرف عن الشخص أشياء كثيرة. بننتبه لحضوره أولاً، وبعدين بنصير نتساءل عن شخصيته، عن أفكاره، عن طموحه، وعن الأشياء اللي بتخليه يضحك بصدق. وأنا ما بدي أظل أبني صورة عنك من بعيد أو أفترض إني بعرفك؛ بالعكس، إذا صار في مجال للتعارف، بفضّل أسمع منك وأعرفك مثل ما إنتِ، مش مثل ما تخيّلتك.

يمكن الرسالة مش الطريقة المعتادة لحتى الواحد يبدأ حكي، ويمكن كان أسهل أبعث كلمة مباشرة، بس التردد أحياناً بخلي أبسط خطوة تبين كبيرة. الخوف من الرفض شعور طبيعي، بس ما بدي أخلي خوفي يمنعني من إني أعبّر عن إعجاب محترم. وبنفس الوقت، ما بدي أخلي شجاعتي بهالخطوة تتحول لضغط عليكِ. عشان هيك خليتلك المساحة كاملة: إنتِ حرة تكمّلي، أو تتجاهلي الرسالة، أو تقرري إنك مش مهتمة، وكل خيار إلك حق فيه.

وفي كلام كثير حاب أوصلك إياه، حتى لو ما كان إله علاقة فيني. لا تستهيني بنفسك، ولا تسمحي للحظات الشك إنها تقنعك إنك مش كفاية. إنتِ مش مطالبة تكوني الأجمل أو الأنجح أو الأقوى طول الوقت، ومش لازم تكسبي إعجاب كل الناس حتى تحسي إنك مهمة. قيمتك مش مسابقة، ومش مقياسها عدد الأشخاص اللي بيلتفتوا إلك. قيمتك في إنك إنسانة إلها أفكارها ومشاعرها وأحلامها، وإلها حق تعيش حياتها بالطريقة اللي بتشبهها.

لما تتطلعي لقدّام، لا تخلي خوفك من الغلط يوقفك. جرّبي الأشياء اللي نفسك فيها، وتعلمي من التجارب اللي ما مشيت مثل ما توقعتي، وافتخري بنفسك حتى لو كانت خطواتك بطيئة. مش كل تقدم لازم يكون واضح للناس؛ أحياناً إنك تكمّلي يوم صعب، أو ترجعي تحاولي بعد خيبة، أو تختاري راحتك بدل إرضاء الجميع، هاي كلها انتصارات تستحق التقدير.

وبتمنى ما تكوني قاسية على حالك. احكي مع نفسك بالطريقة اللي بتحكي فيها مع شخص بتحبيه. لما تغلطي، صححي وتعلمي بدل ما تظلي تلومي نفسك. لما تتعبي، ارتاحي من غير شعور بالذنب. ولما تفرحي، لا تصغّري فرحتك ولا تستني سبب كبير حتى تسمحي لنفسك تضحك. الحياة مش كلها إنجازات ومواعيد وخطط؛ فيها لحظات صغيرة، قعدة حلوة، أغنية بتحبيها، مشوار بسيط، أو حكي صادق مع شخص بيريّح بالك. هاي التفاصيل كمان بتستاهل تنتبهي إلها.

بتمنى يكون حواليك ناس بتحترمك بغيابك قبل حضورك، وبتسمعك من غير ما تحكم عليكِ، وبتفرح لنجاحك من قلبها. بتمنى ما تضطري تغيّري من نفسك حتى تنقبلي، ولا تخفي رأيك حتى ترضي غيرك، ولا تبرري حدودك لكل شخص. الشخص اللي بقدّرك فعلاً رح يحترم إن إلك وقتك ومساحتك وطريقتك بالتفكير. والاهتمام الحقيقي ما لازم يخنقك؛ لازم يخليك مرتاحة وآمنة وعلى طبيعتك.

أما بالنسبة إلي، فبدي أكون صريح أكثر: يمكن إعجابي يضل من طرف واحد، ويمكن تكون هاي الرسالة آخر شيء بيننا، وممكن كمان تفتح باب لتعارف لطيف. أنا ما بعرف شو رح يصير، وما بدي أكتب نهاية لقصة لسه ما بدأت. كل اللي بعرفه إني حبيت أعبّر عن شعور حقيقي، وحبيت تكون البداية بكلام محترم وواضح، من غير مبالغة ومن غير وعود ما إلها أساس.

مش طالب منك تحبيني بسبب رسالة، ولا أتوقع إن كم فقرة ممكن تصنع مشاعر من العدم. هاد مش عدل إلك، ولا هو اللي بتمناه. المشاعر الحلوة إذا إجت، لازم تيجي براحتها، من معرفة ومواقف واحترام متبادل. وإذا ما إجت، ما بنقص من قيمتك ولا من قيمة اللحظة اللي خلتني أكتبلك. كل إنسان إله حق يختار مين يقرب منه، وأنا بحترم هالحق تماماً.

إذا حسّيتي عندك فضول تعرفي مين أنا، أو حابة نعطي فرصة لحكي بسيط، رح أكون مبسوط نبدأ من دون أي توقعات: سلام، سؤال عادي، وحديث نتعرف فيه على بعض شوي شوي. وإذا ما حبيتي، ما في داعي تشرحي أو تبرري؛ تجاهل الرسالة كافي، وبتمنالك كل الخير من قلبي. ما بدي تكون هالكلمات سبب لإحراجك أو تخليكي تحسي إنك مراقبة أو مضطرة تنتبهي لكل نظرة. هي مجرد محاولة لطيفة من شخص حاب يتعرف عليك، والقرار إلك بالكامل.

وبآخر الرسالة، بدي أتركلك أمنية صادقة: يا رب تكون أيامك الجاية أحنّ، وخطواتك أقرب لأحلامك، وقلبك أخف من أي تعب. يا رب تلتقي بناس يشوفوا قيمتك ويحترموا وجودك، وتعيشي لحظات تضحكي فيها من قلبك، وتوصلي لمرحلة تطلعي فيها على نفسك بفخر وتعرفي قديش تعبك ومحاولاتك كانوا مهمين. لا تنسي إنك بتستاهلي الخير، مش لأن شخص مجهول حكى لك هيك، بل لأن كل إنسان بيستحق اللطف والاحترام، وإنتِ واحدة منهم.

يمكن تضل هويتي سر، ويمكن يجي يوم ونحكي ونتعرف بشكل طبيعي. ما بعرف. بس بعرف إني بتمنى تكون هالرسالة مرّت عليكِ بخفة، وتركت ابتسامة صغيرة بدل ما تترك سؤال ثقيل. خذي منها الكلام اللي بيريحك، واتركي أي شيء ما بناسبك. وإذا ما كان إلها تكملة، بتمنى تكون على الأقل ذكرى بسيطة عن كلمة حلوة وصلتك من غير مقابل.

الله يسعد قلبك يا نفين، ويكتبلك كل شيء حلو بتتمنيه، ويخلّي أيامك مليانة راحة وثقة وفرح. 🤍`,
  noText:"ولا يهمك يا نفين، شكراً إنك قرأتي لهون. راحتك أهم من أي رسالة، وبحترم رغبتك تماماً. بتمنالك أيام أهدى وأحلى، وراحة بال بكل خطوة. 🤍"
};
</script>
<script>
(()=>{
const C=CFG,$=s=>document.querySelector(s);
const show=id=>document.querySelectorAll(".scene").forEach(e=>e.classList.toggle("on",e.id===id));
const norm=s=>s.normalize("NFKD").replace(/[ً-ٰٟـ]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/\s+/g," ").trim().toLowerCase();

$("#gTo").textContent="إلى "+C.to;
$("#gSub").textContent=C.gateText;
$("#nX").textContent=C.noText;
$("#maybeMessage").textContent=C.maybeMessage;

// عرض الرسالة صفحةً صفحة
let i=0;const dots=$("#dots");
C.messages.forEach(()=>dots.appendChild(document.createElement("i")));
function step(){
  const m=$("#msg");m.textContent="";
  C.messages[i].split(" ").forEach((word,k)=>{
    const span=document.createElement("span");span.className="w";span.textContent=word;
    span.style.animationDelay=(k*.105)+"s";m.append(span," ");
  });
  [...dots.children].forEach((d,k)=>d.classList.toggle("on",k===i));
  $("#nxt").textContent=i<C.messages.length-1?"كمّلي القراءة":"روحي للتخمين 🤍";
}

const bgMusic=$("#bgMusic");
function playBackgroundMusic(){
  if(!bgMusic)return;
  const promise=bgMusic.play();
  if(promise&&typeof promise.catch==="function"){
    promise.catch(()=>{});
  }
}

$("#gBtn").onclick=()=>{playBackgroundMusic();show("story");step()};
$("#nxt").onclick=()=>{if(i<C.messages.length-1){i++;step()}else show("guess")};

// التخمين: أحمد ينقلها إلى صفحة «يمكن»، وأي اسم آخر تظهر له العبارة المطلوبة فقط.
const secretAnswer=norm(C.secretAnswer);let hintShown=false;
function respondToGuess(){
  const guess=norm($("#gin").value);if(!guess)return;
  if(guess===secretAnswer){show("maybe");return;}
  $("#res").textContent="لا مش هو";
}
$("#go").onclick=respondToGuess;
$("#gin").onkeydown=e=>{if(e.key==="Enter")respondToGuess()};
$("#hBtn").onclick=()=>{
  if(hintShown)return;
  const item=document.createElement("div");item.className="hint";item.textContent="✦ "+C.hint;
  $("#hints").append(item);hintShown=true;$("#hBtn").style.display="none";
};
$("#no").onclick=()=>show("noS");

// إنستغرام فقط؛ نضيف الحساب عندما يصبح جاهزاً
if(C.instagram.trim()){
  const link=document.createElement("a");link.className="btn main";
  link.href="https://instagram.com/"+C.instagram.replace(/^@/,"").trim();
  link.target="_blank";link.rel="noopener noreferrer";link.textContent="احكي معي على إنستغرام ✉";
  $("#links").append(link);
}

// نجوم وقلوب خفيفة بالخلفية
const canvas=$("#fx"),ctx=canvas.getContext("2d"),reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
let W=0,H=0,stars=[],particles=[];
function resize(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);stars=Array.from({length:Math.round(W*H/10500)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.25+.25,p:Math.random()*6,s:.5+Math.random()}));}
addEventListener("resize",resize);resize();
function draw(t){ctx.clearRect(0,0,W,H);ctx.fillStyle="#fff1df";stars.forEach(s=>{ctx.globalAlpha=.25+.65*Math.abs(Math.sin(t/1100*s.s+s.p));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()});
  if(!reduced&&Math.random()<.018)particles.push({x:Math.random()*W,y:H+15,vx:(Math.random()-.5)*.35,vy:-.65-Math.random()*.65,life:2.6,size:9+Math.random()*11});
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=.006;ctx.globalAlpha=Math.max(0,p.life)*.2;ctx.fillStyle="#e69aae";ctx.font=p.size+"px serif";ctx.fillText("♥",p.x,p.y)});particles=particles.filter(p=>p.life>0);ctx.globalAlpha=1;if(!reduced)requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
function burst(){if(reduced)return;for(let k=0;k<58;k++){const a=Math.random()*Math.PI*2,v=1.5+Math.random()*4;particles.push({x:W/2,y:H/2,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.3,life:1.3,size:11+Math.random()*12});}}
})();
</script>
</body>
</html>
